[pytest]
# Pytest configuration for LinkDB backend tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum version
minversion = 7.0

# Add backend to Python path
pythonpath = .

# Test output options
addopts =
    # Verbose output
    -v
    # Show summary of all test outcomes
    -ra
    # Show local variables in tracebacks
    -l
    # Enable strict markers
    --strict-markers
    # Coverage options
    --cov=.
    --cov-report=html
    --cov-report=term-missing
    --cov-report=xml
    # Fail if coverage is below 80%
    --cov-fail-under=80
    # Show warnings
    -W default
    # Capture output
    --capture=no

# Test markers
markers =
    unit: Unit tests for individual modules
    integration: Integration tests for API endpoints
    slow: Tests that take a long time to run
    security: Security-related tests
    performance: Performance benchmark tests

# Coverage options
[coverage:run]
source = .
omit =
    */tests/*
    */migrations/*
    */__pycache__/*
    */venv/*
    */.venv/*
    */dist/*
    */build/*
    app_old.py
    app.py.backup

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    # Standard pragma
    pragma: no cover
    # Debug-only code
    def __repr__
    # Abstract methods
    raise NotImplementedError
    # Type checking
    if TYPE_CHECKING:
    # Main blocks
    if __name__ == .__main__.:

[coverage:html]
directory = htmlcov
